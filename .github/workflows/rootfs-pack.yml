name: Build LinuxDroid RootFS 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rootfs:
    name: Customized ARM RootFS pack
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build RootFS 1
        run: |
          chmod +x rootfs/build-rootfs-1.sh
          rootfs/build-rootfs-1.sh

      - name: Upload customized RootFS assets
        uses: actions/upload-artifact@v4
        with:
          name: LinuxDroid-rootfs-1
          if-no-files-found: error
          path: |
            rootfs/release-1/linuxdroid-rootfs__*.tar.xz
            rootfs/release-1/linuxdroid-rootfs__*.tar.xz.sha256
            rootfs/release-1/ROOTFS_RELEASE_NOTES.md
            rootfs/release-1/ROOTFS_SOURCES.md
