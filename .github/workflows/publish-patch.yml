name: Publish LinuxDroid Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-patch:
    name: Build and publish LinuxDroid 0.4.9
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare PRoot and PulseAudio runtime assets
        run: |
          chmod +x scripts/prepare-runtime.sh gradlew
          ./scripts/prepare-runtime.sh

      - name: Build installable debug APKs
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Publish LinuxDroid 0.4.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.9 \
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk#LinuxDroid-v0.4.9-arm64-v8a-debug.apk \
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk#LinuxDroid-v0.4.9-armeabi-v7a-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LinuxDroid v0.4.9 — relative touchpad, floating gamepad, and startup services" \
            --notes "LinuxDroid 0.4.9 restores true relative Touchpad movement without moving the remote cursor on touch-down, redraws the virtual gamepad as independent transparent buttons on the left and right edges, adds an optional landscape lock enabled by default, obtains Debian Trixie DNS from Android's active network, and adds configurable guest Startup services that run once after a session begins."

      - name: Remove replaced app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v0.4.8 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
