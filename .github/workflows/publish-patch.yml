name: Publish LinuxDroid Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-patch:
    name: Build and publish LinuxDroid 0.4.7
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare PRoot and PulseAudio runtime assets
        run: |
          chmod +x scripts/prepare-runtime.sh gradlew
          ./scripts/prepare-runtime.sh

      - name: Build installable debug APKs
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Publish LinuxDroid 0.4.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.7 \
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk#LinuxDroid-v0.4.7-arm64-v8a-debug.apk \
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk#LinuxDroid-v0.4.7-armeabi-v7a-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LinuxDroid v0.4.7 — VNC controls, gamepad, and Debian DNS repair" \
            --notes "LinuxDroid 0.4.7 restores the complete bottom VNC extra-key strip, improves touchpad pointer positioning and scaled mouse movement, adds an optional transparent draggable virtual gamepad with configurable opacity, and selects RootFS Pack 4. Debian Trixie sessions now bind a working resolver to repair existing images affected by the inherited systemd-resolved stub."

      - name: Remove replaced app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v0.4.6 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
