name: Publish LinuxDroid Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-patch:
    name: Build and publish LinuxDroid 0.4.6
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare PRoot and PulseAudio runtime assets
        run: |
          chmod +x scripts/prepare-runtime.sh gradlew
          ./scripts/prepare-runtime.sh

      - name: Build installable debug APKs
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Publish LinuxDroid 0.4.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.6 \
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk#LinuxDroid-v0.4.6-arm64-v8a-debug.apk \
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk#LinuxDroid-v0.4.6-armeabi-v7a-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LinuxDroid v0.4.6 — flexible desktop VNC and clearer controls" \
            --notes "LinuxDroid 0.4.6 uses TightVNC when available and Xvfb plus x11vnc as a universal desktop fallback, replaces the fixed VNC key strip with a movable floating control palette, safely handles dropped VNC input sockets, removes the foreground notification when terminal Exit stops a session, makes dashboard status notices temporary, and shows every distribution action without horizontal scrolling."

      - name: Remove replaced app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v0.4.5 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
