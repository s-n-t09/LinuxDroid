name: Publish LinuxDroid 1.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish LinuxDroid 1.0 with RootFS 1
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare PRoot and PulseAudio runtime assets
        run: |
          chmod +x scripts/prepare-runtime.sh gradlew
          ./scripts/prepare-runtime.sh

      - name: Build installable debug APKs
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Build RootFS 1
        run: |
          chmod +x rootfs/build-rootfs-1.sh
          rootfs/build-rootfs-1.sh

      - name: Publish RootFS 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create rootfs-1 \
            rootfs/release-1/linuxdroid-rootfs__*.tar.xz \
            rootfs/release-1/linuxdroid-rootfs__*.tar.xz.sha256 \
            rootfs/release-1/ROOTFS_RELEASE_NOTES.md \
            rootfs/release-1/ROOTFS_SOURCES.md \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LinuxDroid RootFS 1 — official images" \
            --notes-file rootfs/release-1/ROOTFS_RELEASE_NOTES.md

      - name: Publish LinuxDroid 1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0 \
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk#LinuxDroid-v1.0-arm64-v8a-debug.apk \
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk#LinuxDroid-v1.0-armeabi-v7a-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LinuxDroid 1.0 — official release" \
            --notes "LinuxDroid 1.0 is the first official release. It includes PRoot Linux environments, internal terminal and VNC, PulseAudio support, verified RootFS 1 images, configurable per-distribution startup services, a full-screen VNC viewer, and a customizable virtual gamepad."

      - name: Remove replaced releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rootfs-pack-4 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release delete v0.4.9 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
