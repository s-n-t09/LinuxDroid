name: Refresh LinuxDroid 1.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Rebuild LinuxDroid 1.0 and RootFS 1
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare PRoot and PulseAudio runtime assets
        run: |
          chmod +x scripts/prepare-runtime.sh gradlew
          ./scripts/prepare-runtime.sh

      - name: Build installable debug APKs
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Build RootFS 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x rootfs/build-rootfs-1.sh
          rootfs/build-rootfs-1.sh

      - name: Point official 1.0 tags at this verified source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f rootfs-1 "$GITHUB_SHA"
          git tag -f v1.0 "$GITHUB_SHA"
          git push --force origin refs/tags/rootfs-1 refs/tags/v1.0

      - name: Replace RootFS 1 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view rootfs-1 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release view rootfs-1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            gh release delete-asset rootfs-1 "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done
          gh release upload rootfs-1 \
            rootfs/release-1/linuxdroid-rootfs__*.tar.xz \
            rootfs/release-1/linuxdroid-rootfs__*.tar.xz.sha256 \
            rootfs/release-1/ROOTFS_RELEASE_NOTES.md \
            rootfs/release-1/ROOTFS_SOURCES.md \
            --repo "$GITHUB_REPOSITORY"
          gh release edit rootfs-1 \
            --repo "$GITHUB_REPOSITORY" \
            --title "LinuxDroid RootFS 1 — refreshed images" \
            --notes-file rootfs/release-1/ROOTFS_RELEASE_NOTES.md

      - name: Replace LinuxDroid 1.0 APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v1.0 \
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk#app-arm64-v8a-debug.apk \
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk#app-armeabi-v7a-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit v1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "LinuxDroid 1.0 — refreshed official build" \
            --notes "Refreshed LinuxDroid 1.0 application and RootFS 1 assets from the current verified source. This maintenance build restores reliable modern RootFS shell startup, correct Ctrl/Alt terminal input, and Debian package-state compatibility without changing the version number."
